name: Release on merge
on:
  pull_request:
    types: [closed]
  # NEVER pull_request_target
permissions:
  contents: write   # only this
jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout merge commit only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Do NOT checkout or execute PR head code
      - name: Create tag + release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Derive tag from HEAD_REF (release/vX → vX); NEVER inline ${{ }} into shell
          TAG="${HEAD_REF#release/}"
          # Validate before use
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.\-]*$ ]]; then
            echo "Refusing invalid tag derived from head ref" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$MERGE_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "Published from mirc via ${HEAD_REF}. Dread merges."
