n94=;Format: /fixholidays username
n95=;Hopefully fixes the issue with holidays not being in the sqlite db.
n96=/fixholidays {
n97=  var %uid = $1
n98=  var %christmas2014 = %christmas2014. [ $+ [ %uid ] ]
n99=  var %christmas2015 = %christmas2015. [ $+ [ %uid ] ]
n100=  var %christmas2016 = %christmas2016. [ $+ [ %uid ] ]
n101=  var %halloween2014 = %halloween2014. [ $+ [ %uid ] ]
n102=  var %halloween2015 = %halloween2015. [ $+ [ %uid ] ]
n103=  ;2016 was accidentally skipped.
n104=  var %halloween2017 = %halloween2017. [ $+ [ %uid ] ]
n105=
n106=  ;echo -a %christmas2014 christmas2014
n107=  ;echo -a %christmas2015 christmas2015
n108=  ;echo -a %christmas2016 christmas2016
n109=  ;echo -a %halloween2014 halloween2014
n110=  ;echo -a %halloween2015 halloween2015
n111=
n112=  if (%christmas2014 = 1) {
n113=    sqliteuserchange %uid christmas2014 1
n114=    ;This next line removes the variable that has been applied.
n115=    ;unset %christmas2014. [ $+ [ %uid ] ]
n116=  }
n117=  if (%christmas2015 = 1) {
n118=    sqliteuserchange %uid christmas2015 1
n119=    ;This next line removes the variable that has been applied.
n120=    ;unset %christmas2015. [ $+ [ %uid ] ]
n121=  }
n122=  if (%christmas2016 = 1) {
n123=    sqliteuserchange %uid christmas2016 1
n124=    ;This next line removes the variable that has been applied.
n125=    ;unset %christmas2016. [ $+ [ %uid ] ]
n126=  }
n127=  if (%halloween2014 = 1) {
n128=    sqliteuserchange %uid halloween2014 1
n129=    ;This next line removes the variable that has been applied.
n130=    ;unset %halloween2014. [ $+ [ %uid ] ]
n131=  }
n132=  if (%halloween2015 = 1) {
n133=    sqliteuserchange %uid halloween2015 1
n134=    ;This next line removes the variable that has been applied.
n135=    ;unset %halloween2015. [ $+ [ %uid ] ]
n136=  }
n137=}
