[script]
n0=alias countdown {
n1=  if ($1 == drawwin) {
n2=    if !$window(@Countdown) { .timercountdown off | halt }
n3=    window @Countdown -1 -1 270 70
n4=    drawtext -br @Countdown 16777215 0 Arial 40 0 0 $duration($calc($ctime($2-) - $ctime))
n5=    halt
n6=  }
n7=  if !$ctime($1-) { echo -ag * /countdown: insufficient parameters | halt }
n8=  window -Cdk0p +t @Countdown -1 -1 270 70 
n9=  drawtext -br @Countdown 16777215 0 Arial 40 0 0 $duration($calc($ctime($1-) - $ctime))
n10=  .timercountdown -h 0 1000 countdown drawwin $1-
n11=}
n12=
n13=alias titles {
n14=  if ($server == $null) set %served Not Connected
n15=  else set %served $server
n16=  titlebar - < $+ $me $+ > - Server: $+ [ [ %served ] ]
n17=}
n18=
n19=on *:START: {
n20=  ./timertitle 0 10 /titles
n21=  //window -e @raw | debug @raw
n22=  ./timeronline 0 300 /oncheck
n23=  ./timerspotty 1 8 /spotify_setup_oauth
n24=  IF (!%bots) SET %bots dahauk gather_bot electricallongboard electricalskateboard commanderroot bobmod_bot lanfusion decafsmurf
n25=  loadscripts
n26=}
n27=
n28=on *:TEXT:*:?,#dreadfullydespized: {
n29=  if ($nick == %bots) {
n30=    echo 4 -a Counter: $nick was detected
n31=  }
n32=  else {
n33=    INC %msgCounter
n34=    if (%msgCounter >= 30) {
n35=      set %msgCounter 0
n36=      echo 11 -a Counter: Hit 30 and has been reset to 0
n37=    }
n38=  }
n39=}
